[project]
name = "rag-lecture"
version = "0.1.0"
description = "Section-based Python sources for the medical RAG lecture"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sentence-transformers[train]==6.2.0",
  "transformers>=5.15,<6",
  "torch>=2.7",
  "datasets>=3,<5",
  "huggingface-hub",
  "peft>=0.17,<1",
  "sentencepiece>=0.2",
  "pandas>=3",
  "scikit-learn>=1.6",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "embedding-atlas>=0.11",
  "umap-learn>=0.5",
  "trectools==0.0.50",
  "ranx>=0.3.20,<0.4",
  "rank-bm25==0.2.2",
  "wandb>=0.19",
  "gliner2[local]==2.1.0",
  "networkx>=3.4",
  "requests>=2.32",
  "nbformat>=5.10",
  "jupyterlab>=4.3",
  "ipykernel>=6.29",
  "torchvision>=0.29.2",
  "anywidget>=0.11.0",
]

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
